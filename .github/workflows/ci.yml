name: CI

# Every branch and every pull request: pushes verify feature work before a PR exists (and the
# automated release PR, whose GITHUB_TOKEN-opened PR fires no pull_request events); the PR run is
# the one that gates a merge. Vercel builds a preview for every branch and PR on its own.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, lint, test and build
    runs-on: ubuntu-latest
    env:
      # Public, and only read at build time: the dev API's origin.
      NEXT_PUBLIC_API_URL: https://pickriders-api-dev.onrender.com
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The committed generated client is what's checked: a backend route this app calls that was
      # renamed or removed fails the type-check, and api.test.ts pins verb and path.
      - name: Type-check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format
        run: npx prettier --check .

      - name: Test
        run: yarn test --ci

      - name: Build
        run: yarn build

  api-contract:
    # Step 12.2: the API the docs describe, against the API that's deployed. backend-api serves its
    # public OpenAPI document at /developer/docs/openapi.json; a breaking change against the copy
    # the reference was built from (src/lib/docs/openapi.json) fails here with what broke. Additive
    # changes pass: refresh the copy with `yarn docs:sync` to document them.
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download the deployed Developer API document
        run: node scripts/fetch-openapi.mjs "$RUNNER_TEMP/developer-openapi.json"

      - name: Compare with the published reference
        run: yarn jest src/lib/docs/openapi-contract.test.ts --ci
        env:
          OPENAPI_NEXT: ${{ runner.temp }}/developer-openapi.json

      # The guides are not sent to the deployed dev API: every run would leave real test orders
      # behind. examples.test.ts checks each request against the API document, e2e/docs.spec.ts runs
      # them in order against the mock, and backend-api's own tests cover what the API does with them.

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the app against e2e/mock-api.mjs and runs the flows in e2e/.
      - name: Run Playwright
        run: yarn e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
